<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlyknitBuddy</title>
  </head>
  <body>
    <!-- 脚本加载前显示的启动卡片（与宿主窗口里的加载卡片一致），Vue 挂载后会被替换 -->
    <div id="app">
      <style>
        @keyframes fk-spin { to { transform: rotate(360deg) } }
        @keyframes fk-in { from { opacity: 0; transform: translateY(6px) } }
        .fk-boot { position: fixed; inset: 0; display: grid; place-items: center; background: #f4f6f9; font-family: 'Be Vietnam Pro', 'Microsoft YaHei UI', 'Microsoft YaHei', 'Segoe UI', sans-serif; }
        .fk-card { width: 380px; max-width: calc(100vw - 32px); box-sizing: border-box; padding: 32px 36px; border-radius: 16px; background: #fff; border: 1px solid #e6e8ee; box-shadow: 0 12px 32px -10px rgba(27, 36, 64, .18); text-align: center; animation: fk-in .2s ease-out; }
        .fk-spin { width: 40px; height: 40px; margin: 0 auto 20px; border-radius: 50%; border: 4px solid #e9ebf2; border-top-color: #3446c9; box-sizing: border-box; animation: fk-spin .9s linear infinite; }
        .fk-title { margin: 0; font-size: 17px; font-weight: 600; color: #1f2330; }
        .fk-sub { margin: 8px 0 0; font-size: 13px; color: #7a8092; }
      </style>
      <div class="fk-boot">
        <div class="fk-card">
          <div class="fk-spin"></div>
          <p class="fk-title" id="fk-title">正在启动 FlyknitBuddy…</p>
          <p class="fk-sub" id="fk-sub">准备就绪后将自动打开工作区。</p>
        </div>
      </div>
      <script>
        ;(function () {
          var lang = new URLSearchParams(location.search).get('lang')
          var text = {
            'vi-VN': ['Đang khởi động FlyknitBuddy…', 'Không gian làm việc sẽ tự mở khi sẵn sàng.'],
            'en-US': ['Starting FlyknitBuddy…', "Your workspace will open automatically when it's ready."],
          }[lang]
          if (text) {
            document.getElementById('fk-title').textContent = text[0]
            document.getElementById('fk-sub').textContent = text[1]
          }
        })()
      </script>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
