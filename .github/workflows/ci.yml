name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      # 换到 PostgreSQL 的部署也要能跑：整套测试在 PostgreSQL 上再跑一遍，含 SQLite → PostgreSQL 迁移
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: flyknit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: pytest on PostgreSQL
        run: python -m pytest -q
        env:
          FLYKNIT_TEST_PG_URL: postgresql+asyncpg://postgres:ci@localhost:5432/flyknit_test

  client:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build chat UI
        working-directory: client/web
        run: |
          npm ci
          npm run build
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test core library
        run: dotnet test client/tests/Flyknit.Core.Tests -c Release
      - name: Build installer, ops agent and updater
        run: |
          dotnet build client/src/Flyknit.Setup -c Release
          dotnet build client/src/Flyknit.Agent -c Release
          dotnet build client/src/Flyknit.Updater -c Release
      - name: Build Windows client
        run: dotnet publish client/src/Flyknit.Client -c Release -r win-x64 --self-contained false -o artifacts/FlyknitBuddy
      - uses: actions/upload-artifact@v4
        with:
          name: FlyknitBuddy-win-x64
          path: artifacts/FlyknitBuddy
