name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      # 换到 PostgreSQL 的部署也要能跑：整套测试在 PostgreSQL 上再跑一遍，含 SQLite → PostgreSQL 迁移
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: flyknit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: pytest on PostgreSQL
        run: python -m pytest -q
        env:
          FLYKNIT_TEST_PG_URL: postgresql+asyncpg://postgres:ci@localhost:5432/flyknit_test

  help:
    # 帮助中心（site/，VitePress）：能编译、没有死链。产物提交在 server/app/static/help，服务端挂在 /help
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build

  client:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build chat UI
        working-directory: client/web
        run: |
          npm ci
          npm run build
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test core library
        run: dotnet test client/tests/Flyknit.Core.Tests -c Release
      - name: Build installer, ops agent and updater
        run: |
          # 一个步骤里有多条命令时，PowerShell 默认只看最后一条的退出码：前面编译失败也会被吞掉（11-12 WPF 编译失败就这样漏过去了）
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet build client/src/Flyknit.Setup -c Release
          dotnet build client/src/Flyknit.Agent -c Release
          dotnet build client/src/Flyknit.Updater -c Release
          dotnet build client/src/Flyknit.Cli -c Release
      - name: Build Windows client
        run: |
          # 一个步骤里有多条命令时，PowerShell 默认只看最后一条的退出码：前面编译失败也会被吞掉（11-12 WPF 编译失败就这样漏过去了）
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet publish client/src/Flyknit.Client -c Release -r win-x64 --self-contained false -o artifacts/FlyknitBuddy
          dotnet publish client/src/Flyknit.Cli -c Release -r win-x64 --self-contained false -o artifacts/FlyknitBuddy
      - uses: actions/upload-artifact@v4
        # 存储配额满时上传会失败：编译和测试已经过了，不让这一步把整个检查标红
        continue-on-error: true
        with:
          name: FlyknitBuddy-win-x64
          path: artifacts/FlyknitBuddy
          # 每次推送都会生成一份一百多 MB 的包，只留 7 天，免得把配额堆满
          retention-days: 7
